
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TLauncher — CheerpJ</title>
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
</head>
<body>
  <h1>TLauncher — CheerpJ</h1>
  <p id="status">Starting TLauncher...</p>

  <script type="module">
    const status = document.getElementById("status");

    try {
      status.textContent = "Initializing CheerpJ...";

      await cheerpjInit({
        overrideDocumentBase:
          "https://tlauncherlauncherman1.github.io/tlauncher-browser/"
      });

      cheerpjCreateDisplay(1000, 700);

      status.textContent = "Loading TLauncher...";

      await cheerpjRunJar("/app/TLauncher.jar");

      status.textContent = "TLauncher started.";
    } catch (error) {
      console.error("TLauncher error:", error);
      status.textContent =
        "Launch error: " + (error?.message || String(error));
    }
  </script>
</body>
</html>
