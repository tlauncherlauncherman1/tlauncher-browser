<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TLauncher — CheerpJ</title>

  <base href="https://tlauncherlauncherman1.github.io/tlauncher-browser/">

  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
</head>
<body>
  <h1>TLauncher — CheerpJ</h1>
  <p id="status">Starting TLauncher...</p>

  <script type="module">
    const status = document.getElementById("status");

    const BASE_URL = "https://tlauncherlauncherman1.github.io/tlauncher-browser/";

    try {
      // Force the page to use the correct GitHub Pages URL
      if (window.location.href !== BASE_URL &&
          window.location.pathname !== "/tlauncher-browser/") {
        window.location.replace(BASE_URL);
      }

      status.textContent = "Initializing CheerpJ...";

      await cheerpjInit({
        overrideDocumentBase: BASE_URL
      });

      cheerpjCreateDisplay(1000, 700);

      status.textContent = "Loading TLauncher...";

      await cheerpjRunJar("/app/TLauncher.jar");

      status.textContent = "TLauncher started.";
    } catch (error) {
      console.error("TLauncher error:", error);
      status.textContent =
        "Launch error: " + (error?.message || String(error));
    }
  </script>
</body>
</html>
