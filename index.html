
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TLauncher — CheerpJ</title>
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
</head>
<body>
  <h1>TLauncher — CheerpJ</h1>
  <p>Starting TLauncher. Please wait...</p>

  <script type="module">
    try {
      await cheerpjInit();

      cheerpjCreateDisplay(1000, 700);

      await cheerpjRunJar("/app/TLauncher.jar");

    } catch (error) {
      console.error("TLauncher error:", error);
      document.body.innerHTML +=
        "<p>Error: " + error.message + "</p>";
    }
  </script>
</body>
</html>
